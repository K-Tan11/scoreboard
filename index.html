<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
        </head>

    <body>
        <div class="container">
            <div>
                <h3 class="title">HOME</h3>
                <h4 id="main-home">0</h4>
                <div>
                    <button class="buttons" onclick="homePlus1()">+1</button>
                    <button class="buttons" onclick="homePlus2()">+2</button>
                    <button class="buttons" onclick="homePlus3()">+3</button>
                </div>
            </div>
            
            <div>
                <h3 class="title">GUEST</h3>
                <h4 id="main-guest">0</h4>
                <div>
                    <button class="buttons" onclick="guestPlus1()">+1</button>
                    <button class="buttons" onclick="guestPlus2()">+2</button>
                    <button class="buttons" onclick="guestPlus3()">+3</button>
                </div>
            </div>
            
        </div>
        <script src="index.js"></script>
    </body>
</html>
